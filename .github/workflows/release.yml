name: Release

# Publishes a GitHub release whenever main has an app version (CFBundleShortVersionString in
# Resources/Info.plist) that hasn't been released yet. Bump the version, push, and this tests,
# builds and uploads the .dmg and .zip. GitHub attaches the source code archives itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Check for a new version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.version.outputs.new == 'true'
        run: swift test

      - name: Build app and disk image
        if: steps.version.outputs.new == 'true'
        run: |
          ./scripts/build-app.sh
          ./scripts/make-dmg.sh

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd build
          shasum -a 256 "Wakeful-$VERSION.dmg" "Wakeful-$VERSION.zip" > SHA256SUMS.txt
          gh release create "v$VERSION" \
            "Wakeful-$VERSION.dmg" "Wakeful-$VERSION.zip" SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Wakeful $VERSION" \
            --generate-notes
